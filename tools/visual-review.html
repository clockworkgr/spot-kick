}

let impactChecks=0;

}

for(const [name,{shot}] of Object.entries(scenarios)){
 const state=catchFor(shot);if(!state)continue;
 const end=shot.frames.at(-1),poseAt=age=>{const t=state.t+age,f=sampleFrame(shot,t);return keeperPose({k:f.k,t,clock:1,ball:new THREE.Vector3().fromArray(f.b),plan:shot.plan,motionState:motionFor(shot),catchState:state,endT:end.t,endK:end.k});};

}
if(minGloveGap<-.0005)throw new Error('Held glove mesh entered ball: '+minGloveGap);
if(minSole<.0009)throw new Error('Boot sole crossed the turf: '+minSole);
if(minFreeSkin<-.005)throw new Error('Recovery mesh crossed the turf: '+minFreeSkin+' '+minSkinTag);
if(minSupportGlove<-.005)throw new Error('Supporting glove crossed turf: '+minSupportGlove);
if(maxJointStep>.7)throw new Error('Kick joint flipped between samples: '+maxJointStep);
if(maxKeeperStep>.9)throw new Error('Keeper joint flipped between samples: '+maxKeeperStep);

for(const [name,{shot,outcome}] of Object.entries(scenarios))for(const t of [.3,shot.frames.at(-1).t+1.4,
 ...motionFor(shot).impacts.flatMap(c=>[c.t-.001,c.t+.07,c.t+.15]),

}
console.info(JSON.stringify({checked,maxStretch,minSole,keeperStretch,moodStretch,maxJointStep,maxKeeperStep,minFreeSkin,minSkinTag,contactError,stretchTag,catchChecks,maxPalmError,minFingerGap,minGloveGap,minGloveTag,minShirtGap,minShirtTag,minSupportGlove}));
if(JSON.stringify(sim)!==original)throw new Error('Animation changed the simulation data');
function sampleFrame(shot,t){
 const frames=shot.frames;if(t<=0)return frames[0];if(t>=frames.at(-1).t)return frames.at(-1);
 const dt=P.SIM.DT*P.SIM.RECORD_EVERY,i=Math.min(frames.length-2,Math.floor(t/dt)),a=frames[i],b=frames[i+1],u=(t-a.t)/(b.t-a.t);

   plant:a.k.plant&&b.k.plant&&a.k.plant.side===b.k.plant.side?a.k.plant:null,act:b.k.act&&b.k.act.t0<=t?b.k.act:a.k.act}};

let view='game',energy=0,playing=false,playCursor=-.85;

range.max=sim.frames.at(-1).t+6;

const poses={game:[.3,1.95,5.6,0,1.05,P.GOAL.Z],stadium:[-18,12,18,0,8,P.GOAL.Z-7],side:[8,1.6,-1,0,1,-2]};
